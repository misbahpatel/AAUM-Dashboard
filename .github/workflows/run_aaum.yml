name: Update AAUM Data

on:
  schedule:
    - cron: "0 6 15 * *"  # runs at 6 AM UTC (11:30 AM IST) on the 15th of every month
  workflow_dispatch:  # lets you also trigger it manually from GitHub's website

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the AAUM fetch script
        run: python fetch_aaum.py

      - name: Commit and push updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add aaum_history.csv
          git commit -m "Auto-update AAUM data" || echo "No changes to commit"
          git push
